<script>
    const songs = [
    { artist: "Takeshi Abo", title: "Lease", file: "music/lease.mp3" },
    { artist: "Persona Q OST", title: "Were Here Now", file: "music/were_here_now.mp3" },
    { artist: "Persona Q OST", title: "Corndog", file: "music/corndog.mp3" },
    { artist: "Persona Q OST", title: "Strange School", file: "music/strange_school.mp3" },
    { artist: "Persona Q OST", title: "Light the Fire - Kagejikan", file: "music/kagejikan.mp3" },
    { artist: "Persona Q OST", title: "Light the Fire - Mayonaka", file: "music/mayonaka.mp3" },
    { artist: "Funkin Sound Team", title: "Stay Funky", file: "music/stay_funky.mp3" },
    { artist: "Toby Fox", title: "Spider Dance", file: "music/spider_dance.mp3" },
    { artist: "Toby Fox", title: "Rude Buster", file: "music/rude_buster.mp3" },
    { artist: "Toby Fox", title: "TV World", file: "music/tv_world.mp3" },
    { artist: "Pokemon OST", title: "Littleroot Town", file: "music/littleroot.mp3" },
    { artist: "Pokemon OST", title: "Rustboro City", file: "music/rustboro.mp3" },
    { artist: "Gorillaz", title: "Tomorrow Comes Today", file: "music/tomorrow.mp3" },
    { artist: "Gorillaz", title: "Melancholy Hill", file: "music/melancholy_hill.mp3" }
];

function playRandomSong() {
    const random = songs[Math.floor(Math.random() * songs.length)];
    
    const audio = document.getElementById("audioPlayer");
    audio.src = random.file;
    audio.loop = true;
    audio.play();

    const box = document.getElementById("nowPlayingBox");
    const text = document.getElementById("nowPlayingText");

    text.textContent = `Now Playing: ${random.artist} — ${random.title}`;
    box.style.display = "block";

    text.style.animation = "none";
    void text.offsetWidth;
    text.style.animation = "scrollText 6s linear infinite";
}

function toggleMusic() {
    const audio = document.getElementById("audioPlayer");
    const btn = document.getElementById("toggleBtn");

    if (audio.paused) {
        audio.play();
        btn.textContent = "Pause";
    } else {
        audio.pause();
        btn.textContent = "Play";
    }
}

</script>
